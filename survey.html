<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex">
<title>استبانة</title>
<link rel="icon" href="icon.svg">
<style>
@font-face{font-family:Tajawal;src:url(fonts/Tajawal-400.ttf);font-weight:400}
@font-face{font-family:Tajawal;src:url(fonts/Tajawal-700.ttf);font-weight:700}
:root{--a:#0f2747;--g:#c9a227;--bg:#f3f5f8;--card:#fff;--line:#dde3ea;--t:#1d2733;--m:#66727f}
body.girls{--a:#8a1f5a;--g:#e48ab8;--bg:#fdf3f8}
*{box-sizing:border-box}body{margin:0;font-family:Tajawal,system-ui,sans-serif;background:var(--bg);color:var(--t);line-height:1.7}
header{background:var(--a);color:#fff;padding:18px 16px;border-bottom:4px solid var(--g)}header h1{margin:0;font-size:1.25rem}header div{opacity:.85;font-size:.9rem}
main{max-width:720px;margin:0 auto;padding:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.q b{display:block;margin-bottom:8px}.opts{display:flex;flex-direction:column;gap:6px}
.opts label{display:flex;gap:8px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:8px 10px;cursor:pointer}
.opts label:has(input:checked){border-color:var(--a);background:color-mix(in srgb,var(--a) 8%,#fff)}
.lik{flex-direction:row;flex-wrap:wrap}.lik label{flex:1 1 110px;justify-content:center;text-align:center;font-size:.92rem}
textarea{width:100%;min-height:80px;font:inherit;border:1px solid var(--line);border-radius:10px;padding:8px}
.btn{display:inline-block;font:inherit;font-weight:700;border:0;border-radius:10px;padding:11px 18px;background:var(--a);color:#fff;cursor:pointer;text-decoration:none;text-align:center}
.btn.g{background:#1f9d55}.btn.o{background:#fff;color:var(--a);border:1px solid var(--a)}
.err{color:#c00000;font-size:.9rem}.muted{color:var(--m);font-size:.9rem}.code{direction:ltr;font-family:monospace;font-size:.8rem;word-break:break-all;background:var(--bg);padding:8px;border-radius:8px}
.row{display:flex;gap:8px;flex-wrap:wrap}.req{color:#c00000}
</style>
</head>
<body>
<header><h1 id="ttl">استبانة</h1><div id="sub"></div></header>
<main id="m"><div class="card">جارٍ التحميل…</div></main>
<script src="survey.js"></script>
</body>
</html>
